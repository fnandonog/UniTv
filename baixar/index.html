<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Download UniTV Oficial</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="icon" href="../img/logo-unitv.png" type="image/png">

    <style>
        /* --- ESTILOS ULTRA MINIMALISTAS --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        :root {
            --bg-body: #050505;
            --gradiente-premium: linear-gradient(135deg, #FF512F 0%, #DD2476 100%);
            --cor-destaque: #ff0080;
        }

        body { 
            background-color: var(--bg-body); 
            color: #f0f0f0; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #1a0525 0%, #050505 80%);
        }

        .download-wrapper {
            text-align: center;
            padding: 20px;
            max-width: 600px;
            width: 100%;
        }

        .logo-main {
            width: 100px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 15px rgba(255, 0, 128, 0.4));
        }

        h1 { 
            font-family: 'Montserrat', sans-serif; 
            font-size: clamp(1.8rem, 8vw, 3rem); 
            line-height: 1.1; 
            font-weight: 900; 
            margin-bottom: 15px; 
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        p { 
            color: #888; 
            font-size: 1.1rem; 
            margin-bottom: 40px;
        }

        .btn-download-direto { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            gap: 20px;
            background: #fff; 
            color: #000; 
            padding: 25px 50px; 
            border-radius: 100px;
            text-decoration: none; 
            font-weight: 900; 
            font-size: 1.5rem; 
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 50px rgba(255,255,255,0.15);
            animation: pulse-border 2s infinite;
        }

        .btn-download-direto:hover { 
            transform: scale(1.08); 
            background: var(--cor-destaque); 
            color: #fff; 
        }

        .android-only {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #444;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
            70% { box-shadow: 0 0 0 30px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .btn-download-direto { padding: 20px 40px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <main class="download-wrapper">
        <img src="../img/logo-unitv.png" alt="UniTV" class="logo-main">
        
        <h1>Instalar <span style="color: var(--cor-destaque)">UniTV VIP</span><br>na sua TV Box</h1>
        
        <p>O download do instalador oficial começará após o clique abaixo.</p>

        <a href="https://app.unitv-plus.site/app/unitv_RS-NPWN.apk" class="btn-download-direto">
            <i class="fa-solid fa-cloud-arrow-down"></i>
            BAIXAR APP AGORA
        </a>
        
        <div class="android-only">
            <i class="fa-brands fa-android"></i>
            Versão Exclusiva para Android
        </div>
    </main>

</body>
</html>
